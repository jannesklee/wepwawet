# Release pipeline for the self-hosted Forgejo instance (forgejo.jannesklee.de)
# — the sole CI/release path for this repo (no GitHub involved). Triggers on
# a v*.*.* tag push.
#
# Before this can run, on forgejo.jannesklee.de:
#   - Actions must be enabled for the repo (repo Settings -> Units -> Actions)
#   - At least one runner must be registered against the instance
#   - `runs-on:` below must match a label your runner actually advertises —
#     "docker" is a common default for a container-based runner, adjust if
#     yours uses something else (check Site Admin -> Actions -> Runners)
#   - Outbound network access to github.com must be allowed for the runner
#     (ACTIONS_HOSTS / outbound firewall) so the `uses: https://github.com/...`
#     steps below can be fetched — Forgejo supports pulling actions directly
#     from a full URL like this, no local mirror required if that's allowed.
#     (This is just pulling a reusable action definition, same as an npm
#     dependency — unrelated to where the repo itself is hosted.)
#   - A repo secret FORGEJO_TOKEN must exist: a Forgejo access token with
#     write:repository scope, added under repo Settings -> Actions -> Secrets

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: docker
    container:
      image: node:22

    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create release tarball
        run: |
          APP_ID=sopdet
          VERSION=${{ steps.version.outputs.version }}
          ARCHIVE="${APP_ID}-${VERSION}.tar.gz"

          # Copy app files into a staging directory named after the app ID
          # (Nextcloud requires the folder inside the tarball to match the app ID)
          mkdir -p /tmp/build/${APP_ID}
          rsync -a --exclude-from=.nextcloudignore . /tmp/build/${APP_ID}/

          tar -czf "${ARCHIVE}" -C /tmp/build "${APP_ID}"
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      # Uncomment once you have the signing certificate from Nextcloud.
      # Store the private key as a Forgejo repo secret named APP_PRIVATE_KEY.
      #
      # - name: Sign tarball
      #   run: |
      #     echo "${{ secrets.APP_PRIVATE_KEY }}" > private.key
      #     openssl dgst -sha512 -sign private.key "${{ env.ARCHIVE }}" | openssl base64 -out "${ARCHIVE}.sig"
      #     rm private.key

      - name: Create Forgejo release and upload tarball
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          set -euo pipefail
          API="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}"

          RELEASE_ID=$(curl -sf -X POST \
            -H "Authorization: token ${FORGEJO_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"${GITHUB_REF_NAME}\",\"name\":\"Sopdet ${GITHUB_REF_NAME}\",\"body\":\"See [CHANGELOG](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/raw/branch/main/CHANGELOG.md) for what's new.\"}" \
            "${API}/releases" | grep -o '"id":[0-9]*' | head -1 | grep -o '[0-9]*')

          curl -sf -X POST \
            -H "Authorization: token ${FORGEJO_TOKEN}" \
            -F "attachment=@${ARCHIVE}" \
            "${API}/releases/${RELEASE_ID}/assets?name=${ARCHIVE}"
          # When signing is enabled, also upload "${ARCHIVE}.sig" the same way.

      # Once signing is enabled, publish to the Nextcloud App Store too. The
      # download-url must point at the Forgejo release asset above, which
      # means it needs to be reachable from the public internet (unauthenticated)
      # for apps.nextcloud.com to fetch it — confirm that's true for this instance
      # before relying on this step.
      #
      # - name: Publish to Nextcloud App Store
      #   uses: https://github.com/R0Wi/nextcloud-appstore-push-action@v1
      #   with:
      #     app-name: sopdet
      #     apps-repo-token: ${{ secrets.APPSTORE_TOKEN }}
      #     download-url: "${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ env.ARCHIVE }}"
      #     signature: file://.sig
      #     nightly: false
