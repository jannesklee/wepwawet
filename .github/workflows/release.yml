# Release pipeline for GitHub (github.com/jannesklee/wepwawet) — the sole
# CI/release path for this repo. Triggers on a v*.*.* tag push.
#
# Before this can run:
#   - A repo secret APPSTORE_TOKEN must exist (API token from apps.nextcloud.com)
#     once the App Store push step below is uncommented.
#   - Once signing is enabled, an APP_PRIVATE_KEY secret (the contents of
#     wepwawet.key) must exist too.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create release tarball
        run: |
          APP_ID=wepwawet
          VERSION=${{ steps.version.outputs.version }}
          ARCHIVE="${APP_ID}-${VERSION}.tar.gz"

          # Copy app files into a staging directory named after the app ID
          # (Nextcloud requires the folder inside the tarball to match the app ID)
          mkdir -p /tmp/build/${APP_ID}
          rsync -a --exclude-from=.nextcloudignore . /tmp/build/${APP_ID}/

          tar -czf "${ARCHIVE}" -C /tmp/build "${APP_ID}"
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      # Uncomment once you have the signing certificate from Nextcloud.
      # Store the private key as a GitHub secret named APP_PRIVATE_KEY.
      #
      # - name: Sign tarball
      #   run: |
      #     echo "${{ secrets.APP_PRIVATE_KEY }}" > private.key
      #     openssl dgst -sha512 -sign private.key "${{ env.ARCHIVE }}" | openssl base64 -out "${ARCHIVE}.sig"
      #     rm private.key

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Wepwawet ${{ github.ref_name }}"
          body: |
            See [CHANGELOG](https://github.com/jannesklee/wepwawet/blob/main/CHANGELOG.md) for what's new.
          files: ${{ env.ARCHIVE }}
          # When signing is enabled, change the line above to:
          # files: |
          #   ${{ env.ARCHIVE }}
          #   ${{ env.ARCHIVE }}.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Once signing is enabled, publish to the Nextcloud App Store too. The
      # download-url must point at the GitHub release asset above.
      #
      # - name: Publish to Nextcloud App Store
      #   uses: R0Wi/nextcloud-appstore-push-action@v1
      #   with:
      #     app-name: wepwawet
      #     apps-repo-token: ${{ secrets.APPSTORE_TOKEN }}
      #     download-url: "https://github.com/jannesklee/wepwawet/releases/download/${{ github.ref_name }}/${{ env.ARCHIVE }}"
      #     signature: file://.sig
      #     nightly: false
